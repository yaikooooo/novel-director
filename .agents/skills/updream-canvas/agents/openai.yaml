interface:
  display_name: "UPDREAM 节点铺设"
  short_description: "按段只配置视频节点，直接绑定参考图、角色样音和完整声画，不额外铺展示节点"
  default_prompt: "使用 $updream-canvas，在 Codex 内置浏览器（iab）接手当前 UPDREAM 页面，按用户指定执行方式配置每段视频节点。分镜、角色及场景参考图和角色样音直接绑定视频输入，不另建展示图片、音频、文字节点或排版连线。提示词保留简短音频与角色映射，去掉声线ID、版本和重复音色总述，保留逐句表演与台词。模型采用 Seedance 2.5，分辨率沿用户指定、画幅沿章节已确认结果，时长向上取整；只铺节点时停在生成前，已有直接生成授权则继续。"
